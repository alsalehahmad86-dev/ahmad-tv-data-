name: Refresh public data feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '17,57 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-public-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh football, finance, and French holiday JSON
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/refresh_data.py
      - name: Publish changed JSON files with the repository token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football.json finance.json fr-holidays.json
          if git diff --cached --quiet; then
            echo "No feed changes to publish."
            exit 0
          fi
          git commit -m "Refresh public data feeds"
          git push origin HEAD:main
